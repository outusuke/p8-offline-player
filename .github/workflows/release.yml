name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the draft release (e.g. v0.1.7)
        type: string
        required: true

jobs:
  desktop:
    uses: ./.github/workflows/build.yml
  appimage:
    uses: ./.github/workflows/appimage.yml
  flatpak:
    uses: ./.github/workflows/flatpak.yml
  android:
    # android-signed has its own release job that asks for write, even when skipped
    permissions:
      contents: write
    uses: ./.github/workflows/android-signed.yml
    secrets: inherit

  release:
    needs: [desktop, appimage, flatpak, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pico8-player-*
          path: dist
          merge-multiple: true
      - run: ls -lR dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          draft: true
          generate_release_notes: true
