name: android
on:
  workflow_dispatch:
  workflow_call:

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK / NDK
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm install
      - run: '[ -f src-tauri/icons/icon.ico ] || npx tauri icon app-icon.png'
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64 --target armv7
      # throwaway key: installs fine, but updates only apply over builds signed with the same key
      - name: Sign
        run: |
          keytool -genkeypair -keystore ci.jks -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=ci"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ci.jks --ks-pass pass:android --out pico8-player.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pico8-player-apk
          path: pico8-player.apk
