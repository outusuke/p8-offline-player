name: flatpak
on:
  workflow_dispatch:
  workflow_call:

jobs:
  binary:
    runs-on: ubuntu-22.04     # old glibc so the binary runs inside any newer runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: npm install
      - run: '[ -f src-tauri/icons/icon.ico ] || npx tauri icon app-icon.png'
      - run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: src-tauri/target/release/pico8-player

  flatpak:
    needs: binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: flatpak
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: pico8-player.flatpak
          manifest-path: flatpak/dev.local.pico8player.yml
          cache-key: flatpak-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: pico8-player-flatpak
          path: pico8-player.flatpak
