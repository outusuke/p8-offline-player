name: android-signed
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft release with the signed APK
        type: boolean
        default: false
      tag:
        description: Tag for the draft release (e.g. v0.1.0)
        type: string
        default: ""

env:
  NDK_VERSION: "27.2.12479018"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DRAFT: ${{ inputs.draft_release }}
          TAG: ${{ inputs.tag }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret $v is empty or not set"; exit 1; }
          done
          if [ "$DRAFT" = "true" ] && [ -z "$TAG" ]; then
            echo "::error::draft_release needs a tag"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # decoded before the long build so a bad keystore or password fails in seconds
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
      - name: Android SDK / NDK
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm install
      - run: '[ -f src-tauri/icons/icon.ico ] || npx tauri icon app-icon.png'
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          [ -n "$APK" ] || { echo "::error::no unsigned APK found"; exit 1; }
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out pico8-player.apk aligned.apk
          "$BT/apksigner" verify --print-certs pico8-player.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: pico8-player-apk-signed
          path: pico8-player.apk

  release:
    needs: apk
    if: ${{ inputs.draft_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pico8-player-apk-signed
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: dist/pico8-player.apk
