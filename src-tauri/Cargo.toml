[package]
name = "pico8-player"
version = "0.1.0"
edition = "2021"

[lib]
name = "pico8_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
